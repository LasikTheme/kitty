#!/bin/bash
#-----------------------------------------------------------------------
#          File: ~/.config/kitty/themes/lasik.conf
#        Colors: https://github.com/LasikTheme/palette (palette.toml)
#   Description: Lasik theme for Kitty terminal,
#                ported from https://github.com/LasikTheme/konsole
# Compatibility: Debian, Ubuntu, Armbian, macOS
#       Version: 0.2.0
#        Author: Aamnah
#          Link: https://aamnah.com
#          Date: 2026-04-27
#       Lastmod: 2026-10-24
#-----------------------------------------------------------------------
# reload settings with: Ctrl+Shift+F5

foreground              #b7c9ff  # NEUTRAL_300, the text (not white: white on black causes a halo)
background              #01030a  # OBSIDIAN

selection_foreground    #cad8ff  # NEUTRAL_200, 7.2:1 on NEUTRAL_800
selection_background    #384058  # NEUTRAL_800

cursor                  #e0a0db  # PINK_400, the Lasik accent
cursor_text_color       #01030a  # OBSIDIAN

url_color               #02bbcc  # SAPPHIRE_400

# The basic 16 terminal colors: step 400 of each hue (the Lasik scale, palette.toml)
color0                  #384058  # NEUTRAL_800, black
color1                  #ff96a9  # RED_400
color2                  #a0c38f  # GREEN_400
color3                  #cab280  # YELLOW_400
color4                  #74bbf7  # BLUE_400
color5                  #db9cff  # MAUVE_400
color6                  #02bbcc  # SAPPHIRE_400
color7                  #b7c9ff  # NEUTRAL_300, white

# Bright colors: step 200, lighter than the normal colors (step 400)
color8                  #8595c9  # NEUTRAL_500, bright black: shell suggestions and git hints, so 7:1
color9                  #ffccd2  # RED_200
color10                 #bee3ad  # GREEN_200
color11                 #f1d69a  # YELLOW_200
color12                 #b6ddff  # BLUE_200
color13                 #ecceff  # MAUVE_200
color14                 #5cecfd  # SAPPHIRE_200
color15                 #cad8ff  # NEUTRAL_200, bright white

# Optional UI colors
## Tab bars
tab_bar_background      #01030a  # OBSIDIAN
active_tab_background   #384058  # NEUTRAL_800
active_tab_foreground   #cad8ff  # NEUTRAL_200, 7.2:1 on NEUTRAL_800
inactive_tab_background #272d3f  # NEUTRAL_900
inactive_tab_foreground #8595c9  # NEUTRAL_500, 4.7:1 on NEUTRAL_900

tab_bar_style           slant
tab_title_template      "{index} {title}"
tab_activity_symbol     "●"


## Distniguish window splits
inactive_text_alpha     0.1
active_border_color     #e0a0db  # PINK_400, the accent
inactive_border_color   #272d3f  # NEUTRAL_900
window_padding_width    8
window_border_width     1pt
draw_minimal_borders    no

#!/bin/bash
#-----------------------------------------------------------------------
#          File: ~/.config/kitty/themes/lasik.conf
#        Colors: https://github.com/LasikTheme/palette (palette.toml)
#   Description: Lasik theme for Kitty terminal,
#                ported from https://github.com/LasikTheme/konsole
# Compatibility: Debian, Ubuntu, Armbian, macOS
#       Version: 0.2.0
#        Author: Aamnah
#          Link: https://aamnah.com
#          Date: 2026-04-27
#       Lastmod: 2026-10-24
#-----------------------------------------------------------------------
# reload settings with: Ctrl+Shift+F5

foreground              #e8ecfd  # LAVENDER_BRIGHT (not white: white on black causes a halo)
background              #01030a  # OBSIDIAN

selection_foreground    #e8ecfd  # LAVENDER_BRIGHT, 7.7:1 on SLATE
selection_background    #3c476c  # SLATE

cursor                  #e8ecfd  # LAVENDER_BRIGHT
cursor_text_color       #01030a  # OBSIDIAN

url_color               #02bbcc  # SAPPHIRE

# The basic 16 terminal colors
color0                  #3c476c  # SLATE
color1                  #d24e6d  # RED
color2                  #a0c38f  # GREEN
color3                  #ffe2a3  # YELLOW
color4                  #569cd6  # BLUE
color5                  #c175ea  # MAUVE
color6                  #02bbcc  # SAPPHIRE
color7                  #d1dafa  # LAVENDER

# Bright colors: the BRIGHT tier, lighter than the normal colors
# (bright black is used for shell suggestions and git hints, so it must be readable)
color8                  #8796c4  # SLATE_BRIGHT, 7.0:1
color9                  #f16a87  # RED_BRIGHT
color10                 #b9dda8  # GREEN_BRIGHT
color11                 #ffeabd  # YELLOW_BRIGHT
color12                 #6fb5f1  # BLUE_BRIGHT
color13                 #d893ff  # MAUVE_BRIGHT
color14                 #3fd5e6  # SAPPHIRE_BRIGHT
color15                 #e8ecfd  # LAVENDER_BRIGHT

# Optional UI colors
## Tab bars
tab_bar_background      #01030a  # OBSIDIAN
active_tab_background   #3c476c  # SLATE
active_tab_foreground   #d1dafa  # LAVENDER, 6.5:1
inactive_tab_background #2a324b  # SLATE_DEEP
inactive_tab_foreground #8b9ac7  # 4.5:1 (was 1.4)

tab_bar_style           slant
tab_title_template      "{index} {title}"
tab_activity_symbol     "●"


## Distniguish window splits
inactive_text_alpha     0.1
active_border_color     #c175ea  # MAUVE
inactive_border_color   #2a324b  # SLATE_DEEP
window_padding_width    8
window_border_width     1pt
draw_minimal_borders    no
